name: Terraform Apply (manual)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select environment to run"
        required: true
        type: choice
        default: dev
        options:
          - dev
          - prod
          - qa
          - stage

      backend_rg:
        description: "Backend resource group name"
        required: true
        type: string
        default: tfstate-rg

      backend_sa:
        description: "Backend storage account name"
        required: true
        type: string
        default: tfstatestgact321

      backend_container:
        description: "Backend container name"
        required: true
        type: string
        default: tfstate

permissions:
  id-token: write
  contents: read

env:
  TF_CLI_ARGS: "-no-color"
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}

jobs:
  terraform-apply:
    name: Terraform Apply (${{ inputs.environment }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set environment config
        id: config
        shell: bash
        run: |
          case "${{ inputs.environment }}" in
            dev) TFVARS_FILE="dev.tfvars"; BACKEND_KEY="dev.terraform.tfstate" ;;
            qa) TFVARS_FILE="qa.tfvars"; BACKEND_KEY="qa.terraform.tfstate" ;;
            stage) TFVARS_FILE="stage.tfvars"; BACKEND_KEY="stage.terraform.tfstate" ;;
            prod) TFVARS_FILE="prod.tfvars"; BACKEND_KEY="prod.terraform.tfstate" ;;
            *) echo "Unsupported environment: ${{ inputs.environment }}"; exit 1 ;;
          esac

          echo "TFVARS_FILE=$TFVARS_FILE" >> "$GITHUB_OUTPUT"
          echo "BACKEND_KEY=$BACKEND_KEY" >> "$GITHUB_OUTPUT"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}

      - name: Terraform Init
        shell: bash
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ inputs.backend_rg }}" \
            -backend-config="storage_account_name=${{ inputs.backend_sa }}" \
            -backend-config="container_name=${{ inputs.backend_container }}" \
            -backend-config="key=${{ steps.config.outputs.BACKEND_KEY }}" \
            -reconfigure

      - name: Terraform Validate
        shell: bash
        run: terraform validate

      - name: Terraform Plan
        shell: bash
        run: |
          terraform plan \
            -var-file="tfvars/${{ steps.config.outputs.TFVARS_FILE }}" \
            -out="tfplan-${{ inputs.environment }}.tfplan"

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ inputs.environment }}
          path: tfplan-${{ inputs.environment }}.tfplan

      - name: Terraform Apply
        shell: bash
        run: |
          terraform apply \
            -auto-approve \
            "tfplan-${{ inputs.environment }}.tfplan"
      - name: Show Terraform state
        shell: bash
        run: terraform state list || true

name: Terraform Apply (manual)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select environment to run"
        required: true
        type: choice
        default: dev
        options:
          - dev
          - prod
          - qa
          - stage

      # tfvars_file is derived from the selected environment

      backend_rg:
        description: "Backend resource group name"
        required: true
        type: string
        default: tfstate-rg

      backend_sa:
        description: "Backend storage account name"
        required: true
        type: string
        default: tfstatestgact321

      backend_container:
        description: "Backend container name"
        required: true
        type: string
        default: tfstate

permissions:
  id-token: write
  contents: read

env:
  TF_CLI_ARGS: "-no-color"
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}

jobs:
  set-matrix:
    name: Build target matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Determine selected environment
        id: matrix
        shell: bash
        run: |
          ENV_SELECTED="${{ github.event.inputs.environment }}"

          case "$ENV_SELECTED" in
            dev) tfvars="dev.tfvars"; backend_key="dev.terraform.tfstate" ;;
            prod) tfvars="prod.tfvars"; backend_key="prod.terraform.tfstate" ;;
            qa) tfvars="qa.tfvars"; backend_key="qa.terraform.tfstate" ;;
            stage) tfvars="stage.tfvars"; backend_key="stage.terraform.tfstate" ;;
            *) echo "Unsupported environment: $ENV_SELECTED"; exit 1 ;;
          esac

          JSON="[{\"environment\":\"$ENV_SELECTED\",\"tfvars_file\":\"$tfvars\",\"backend_key\":\"$backend_key\"}]"
          echo "matrix=${JSON}" >> "$GITHUB_OUTPUT"

  terraform-apply:
    name: Terraform Plan and Apply (${{ matrix.environment }})
    needs: set-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.set-matrix.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan repository for secrets (gitleaks)
        run: |
          mkdir -p reports
          docker run --rm -v "${{ github.workspace }}":/src ghcr.io/gitleaks/gitleaks:v8.24.2 \
            dir /src --no-banner --redact --exit-code 1 \
            --report-format=sarif --report-path=/src/reports/gitleaks.sarif

      - name: Upload gitleaks SARIF
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-sarif-${{ matrix.environment }}
          path: reports/gitleaks.sarif

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Static IaC checks (Checkov)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}

      - name: Diagnostic: storage account and container state
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking storage account and container before terraform init"
          echo "Storage Account: ${{ github.event.inputs.backend_sa }}"
          echo "Resource Group: ${{ github.event.inputs.backend_rg }}"
          echo "Container: ${{ github.event.inputs.backend_container }}"
          az storage account show -n "${{ github.event.inputs.backend_sa }}" -g "${{ github.event.inputs.backend_rg }}" -o table || true
          echo "Container show:" 
          az storage container show --account-name "${{ github.event.inputs.backend_sa }}" --name "${{ github.event.inputs.backend_container }}" --auth-mode login -o json || echo "container-not-found"
          echo "Listing blobs (if any):"
          az storage blob list --account-name "${{ github.event.inputs.backend_sa }}" --container-name "${{ github.event.inputs.backend_container }}" --auth-mode login --output table || true

      - name: Terraform init
        shell: bash
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ github.event.inputs.backend_rg }}" \
            -backend-config="storage_account_name=${{ github.event.inputs.backend_sa }}" \
            -backend-config="container_name=${{ github.event.inputs.backend_container }}" \
            -backend-config="key=${{ matrix.backend_key }}"

      - name: Install TFLint
        run: |
          mkdir -p /tmp/tflint && cd /tmp/tflint
          curl -sL -o tflint.zip "https://github.com/terraform-linters/tflint/releases/latest/download/tflint_linux_amd64.zip"
          unzip -q tflint.zip
          sudo mv tflint /usr/local/bin/
          tflint --version

      - name: Run TFLint
        run: |
          tflint --init
          tflint

      - name: Terraform plan
        run: |
          terraform plan -var-file="tfvars/${{ matrix.tfvars_file }}" -out="tfplan-${{ matrix.environment }}.tfplan"

      - name: Terraform apply
        run: |
          terraform apply -auto-approve "tfplan-${{ matrix.environment }}.tfplan"

      - name: Verify remote tfstate blob
        shell: bash
        run: |
          set -euo pipefail
          echo "Verifying remote tfstate blob '${{ matrix.backend_key }}' in container '${{ github.event.inputs.backend_container }}'..."
          exists=$(az storage blob exists \
            --account-name "${{ github.event.inputs.backend_sa }}" \
            --container-name "${{ github.event.inputs.backend_container }}" \
            --name "${{ matrix.backend_key }}" \
            --auth-mode login \
            --query "exists" -o tsv)
          echo "exists=$exists"
          if [ "$exists" != "true" ]; then
            echo "Remote tfstate blob not found; listing blobs for debug:"
            az storage blob list --account-name "${{ github.event.inputs.backend_sa }}" --container-name "${{ github.event.inputs.backend_container }}" --auth-mode login --output table || true
            exit 1
          fi
          echo "Remote tfstate blob found."
